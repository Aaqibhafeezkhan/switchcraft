name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: shellcheck
        run: |
          shellcheck --shell=bash --severity=style \
            bin/switchcraft lib/*.sh install.sh uninstall.sh tests/test_helper.bash

      - name: shfmt
        run: |
          shfmt -d bin/switchcraft lib/*.sh install.sh uninstall.sh tests/test_helper.bash

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          echo "$RUNNER_TEMP/bats/bin" >>"$GITHUB_PATH"

      - name: Report bash version
        run: bash --version | head -1

      - name: Run tests
        run: bats --print-output-on-failure tests/

  install:
    name: install.sh end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install into a throwaway HOME
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          : >"$HOME/.bashrc"
          ./install.sh --projects-root "$HOME/projects"
          "$HOME/.local/bin/switchcraft" add work \
            --name 'CI User' --email ci@example.com --github-user ci-user
          "$HOME/.local/bin/switchcraft" list
          git -C "$HOME/projects/work" init -q
          test "$(git -C "$HOME/projects/work" config user.email)" = ci@example.com
          SC_YES=1 "$HOME/.local/bin/switchcraft" uninstall
          ! grep -q switchcraft "$HOME/.gitconfig"
